name: Build Native Windows App & Verify Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (defaults to package.json version if blank)'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Cub Spiele.Com Windows x64 App & Verify Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Read Version from package.json
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $tag = if ("${{ github.event.inputs.tag_name }}") { "${{ github.event.inputs.tag_name }}" } else { "v$ver" }
          $title = if ("${{ github.event.inputs.release_title }}") { "${{ github.event.inputs.release_title }}" } else { "Cub Spiele.Com $tag — Standalone Handheld Emulator Release" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Typecheck Codebase
        run: npm run lint

      - name: Build Production Bundle & Self-Contained Multi-Platform Packages
        run: npm run release:all

      - name: Install Electron & Builder Runtime (CI-Only)
        run: npm install --no-save --no-audit --no-fund electron@35.1.5 electron-builder@26.0.12

      - name: Build Full Native Electron Windows Portable & Setup EXEs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win --x64 --config electron-builder.yml --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CubSpieleCom-Windows-x64-Package
          path: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-${{ steps.meta.outputs.tag }}-win64.zip
            public/releases/releases-manifest.json
            release/CubSpieleCom-*.exe

      - name: Publish GitHub Release (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          files: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-${{ steps.meta.outputs.tag }}-win64.zip
            release/CubSpieleCom-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
