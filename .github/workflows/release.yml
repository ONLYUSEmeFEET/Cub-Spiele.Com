name: Build Native Windows App & Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Cub Spiele.Com v1.2.0 — Standalone Handheld Emulator (Windows x64)'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Cub Spiele.Com Windows x64 App (.exe & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11 (PE32+ Launcher & Packaging)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Emulator Core (Vite + SM8521 Core)
        run: npm run build

      - name: Generate Native Windows x64 Portable Release Package & PE32+ Executable
        run: python scripts/build-windows-release.py

      - name: Package Electron Native Windows NSIS & Portable Executables
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CubSpieleCom-Windows-x64-Release-Packages
          path: |
            public/releases/*.exe
            public/releases/*.zip
            release/*.exe
            release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('Cub Spiele.Com {0} (Windows x64)', github.ref_name) }}
          generate_release_notes: true
          files: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v1.2.0-win64.zip
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
