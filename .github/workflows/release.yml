name: Build Native Windows App & Verify Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Cub Spiele.Com v1.4.0 — Competitive Hardcore Mode, Online Leaderboards, Multi-Player High Score Vault & RetroAchievements Integration'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Cub Spiele.Com Windows x64 App & Verify Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11 (PE32+ Launcher & Packaging)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install

      - name: Typecheck Codebase
        run: npm run lint

      - name: Build Production Emulator Core (Vite dist/)
        run: npm run build

      - name: Generate Native Windows x64 Portable Release & PE32+ Executable
        run: python scripts/build-windows-release.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CubSpieleCom-Windows-x64-Package
          path: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v1.4.0-win64.zip
            public/releases/releases-manifest.json

      - name: Publish GitHub Release (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          generate_release_notes: true
          files: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-${{ github.event.inputs.tag_name }}-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
