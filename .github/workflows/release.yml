name: Build Native Windows App & Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Cub Spiele.Com v1.2.0 — Standalone Handheld Emulator, 4-Shade SGB/GBC Colorizer & Dist Release'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Cub Spiele.Com Windows x64 App, Dist Bundle & GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11 (PE32+ Launcher & Packaging)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install

      - name: Typecheck Codebase
        run: npm run lint

      - name: Build Production Emulator Core (Vite dist/)
        run: npm run build

      - name: Generate Native Windows x64 Portable Release, Dist ZIP & PE32+ Executable
        run: python scripts/build-windows-release.py

      - name: Upload Build & Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CubSpieleCom-Windows-x64-and-Dist-Packages
          path: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v1.2.0-win64.zip
            public/releases/CubSpieleCom-v1.2.0-dist.zip
            public/releases/CubSpieleCom-Antigravity-Workspace.zip
            public/releases/releases-manifest.json
            dist/index.html
            dist/assets/*

      - name: Publish GitHub Release with Dist & Win64 Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.2.0' }}
          name: ${{ github.event.inputs.release_title || 'Cub Spiele.Com v1.2.0 — Standalone Handheld Emulator, 4-Shade SGB/GBC Colorizer & Dist Release' }}
          generate_release_notes: true
          files: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v1.2.0-win64.zip
            public/releases/CubSpieleCom-v1.2.0-dist.zip
            public/releases/CubSpieleCom-Antigravity-Workspace.zip
            public/releases/releases-manifest.json
            dist/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
