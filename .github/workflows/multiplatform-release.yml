name: Multi-Platform Release Build (Windows, macOS, Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-multiplatform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build Web & Multi-Platform Bundles (Self-Contained Win64 EXE/ZIP, macOS Universal, Android APK)
        run: npm run release:all

      - name: Build Native Electron Portable/Installer (Windows)
        if: runner.os == 'Windows'
        run: npx --yes -p electron@35.1.5 -p electron-builder@26.0.12 electron-builder --win --x64 --config electron-builder.yml

      - name: Build Native Electron Bundle (macOS)
        if: runner.os == 'macOS'
        run: npx --yes -p electron@35.1.5 -p electron-builder@26.0.12 electron-builder --mac --universal --config electron-builder.yml

      - name: Upload Multi-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cub-spiele-com-${{ matrix.os }}
          path: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v*-win64.zip
            public/releases/CubSpieleCom-v*-macos-universal.zip
            public/releases/CubSpieleCom-v*-android.apk
            release/CubSpieleCom-*.*
