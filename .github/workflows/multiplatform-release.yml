name: Multi-Platform Release Build (Windows, macOS, Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-multiplatform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build Web & Multi-Platform Bundles (Win64, macOS Universal, Android APK)
        run: npm run release:all

      - name: Upload Multi-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cub-spiele-com-${{ matrix.os }}
          path: |
            public/releases/CubSpieleCom.exe
            public/releases/CubSpieleCom-v*-win64.zip
            public/releases/CubSpieleCom-v*-macos-universal.zip
            public/releases/CubSpieleCom-v*-android.apk
